<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sadece Bizim İçin ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 50%, #f48fb1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        #lock-screen {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 400px;
            width: 100%;
            animation: fadeIn 0.8s ease-in-out;
        }
        #lock-screen h2 {
            color: #d81b60;
            margin-bottom: 10px;
            font-size: 24px;
        }
        #lock-screen p {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        input[type="password"] {
            width: 100%;
            padding: 14px;
            border: 2px solid #f48fb1;
            border-radius: 10px;
            outline: none;
            font-size: 16px;
            text-align: center;
            letter-spacing: 2px;
            transition: all 0.3s;
        }
        input[type="password"]:focus {
            border-color: #d81b60;
            box-shadow: 0 0 8px rgba(216, 27, 96, 0.3);
        }
        button {
            width: 100%;
            padding: 14px;
            background: #d81b60;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }
        button:hover {
            background: #c2185b;
        }
        button:active {
            transform: scale(0.98);
        }
        #error-msg {
            color: #e53935;
            font-size: 13px;
            margin-top: 12px;
            display: none;
        }
        #protected-content {
            display: none;
            width: 100%;
            max-width: 800px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="lock-screen">
        <h2>🔒 Gizli Sayfa</h2>
        <p>Bu alan özeldir. İçeriği görmek için lütfen şifreyi giriniz.</p>
        <div class="input-group">
            <input type="password" id="passInput" placeholder="Şifre (GGAAYYYY)" maxlength="8">
        </div>
        <button onclick="checkPassword()">Giriş Yap ❤️</button>
        <p id="error-msg">Hatalı şifre! Lütfen tekrar dene.</p>
    </div>

    <div id="protected-content">
        <h1 style="color: #d81b60; text-align: center; margin-bottom: 20px;">Hoş Geldin Sevgilim ❤️</h1>
        <p style="text-align: center; color: #555; line-height: 1.6;">
            Bu sayfa sadece ikimiz için hazırlandı...
        </p>
    </div>

    <script>
        function checkPassword() {
            const secret = "09062026";
            const input = document.getElementById("passInput").value;
            const errorMsg = document.getElementById("error-msg");
            const lockScreen = document.getElementById("lock-screen");
            const protectedContent = document.getElementById("protected-content");

            if (input === secret) {
                lockScreen.style.display = "none";
                protectedContent.style.display = "block";
            } else {
                errorMsg.style.display = "block";
                document.getElementById("passInput").value = "";
            }
        }

        document.getElementById("passInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                checkPassword();
            }
        });
    </script>
</body>
</html>
